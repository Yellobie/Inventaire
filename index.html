<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5F74">
<title>Inventaire</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --fond:#F6F7F8; --carte:#FFFFFF; --encre:#161B1F; --gris:#79858C; --gris-clair:#E2E7EA;
  --accent:#1E5F74; --danger:#A8262B;
  --c-ps:#123D8C; --c-nin:#C4162B; --c-xbox:#0E6B22; --c-neutre:#59636B;
  --c-societe:#B26A18; --c-livre:#6A4C93; --c-materiel:#1E5F74; --c-figurine:#A83262;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --corps:'Karla','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--fond);color:var(--encre);font-family:var(--corps);
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}

#barre{background:var(--carte);border-bottom:1px solid var(--gris-clair);
  padding:12px 16px 10px;display:flex;align-items:center;gap:11px;flex:0 0 auto}
#retour{background:none;border:none;font-size:22px;line-height:1;color:var(--accent);
  display:none;padding:0 2px;cursor:pointer}
#titre{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  font-size:19px;line-height:1.1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#compte{font-family:var(--mono);font-size:11px;color:var(--gris);flex:0 0 auto}

#pastille{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:11px;color:var(--gris);background:var(--fond);border:1px solid var(--gris-clair);
  flex:0 0 auto;cursor:pointer;max-width:140px;overflow:hidden;white-space:nowrap}
#pastille span:last-child{overflow:hidden;text-overflow:ellipsis}
.point{width:7px;height:7px;border-radius:50%;background:var(--gris);flex:0 0 7px}
.point.ok{background:#2E9E5B} .point.occupe{background:var(--accent);animation:pulse 1s infinite}
.point.hs{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.recherche{margin:12px 16px 0;position:relative;flex:0 0 auto}
.recherche input{width:100%;padding:10px 12px 10px 34px;background:var(--carte);
  border:1px solid var(--gris-clair);border-radius:8px;font-size:14px;outline:none}
.recherche input:focus{border-color:var(--accent)}
.recherche::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--gris);font-size:17px}

#corps{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}

.rayon{background:var(--carte);border:1px solid var(--gris-clair);border-radius:10px;
  padding:12px 13px 0;margin-bottom:10px;cursor:pointer}
.rayon:active{background:#F0F3F5}
.rayon .titre{display:flex;align-items:baseline;justify-content:space-between}
.rayon .titre h3{font-family:var(--display);font-weight:500;text-transform:uppercase;
  letter-spacing:.05em;font-size:15px}
.rayon .titre span{font-family:var(--mono);font-size:12px;color:var(--gris)}
.rayon .sous{font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etagere{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:10px}
.dos{border-radius:1px 1px 0 0;min-width:2px}
.plateau{height:3px;background:#20272C;border-radius:1px;margin-bottom:12px}
.placeholder{width:100%;border:1px dashed #C3CBD0;height:22px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#9AA5AB}

.ligne{display:flex;align-items:center;gap:11px;background:var(--carte);
  border:1px solid var(--gris-clair);border-radius:8px;padding:11px 12px;margin-bottom:7px;cursor:pointer}
.ligne:active{background:#F0F3F5}
.ligne .marque{width:5px;height:26px;border-radius:2px;flex:0 0 5px}
.ligne .nom{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;
  font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .n{font-family:var(--mono);font-size:12px;color:var(--gris);flex:0 0 auto}

.objet{display:flex;align-items:center;gap:10px;padding:11px 2px;
  border-bottom:1px solid #EAEEF0;font-size:14px;line-height:1.35;cursor:pointer}
.objet:active{background:#EFF2F4}
.objet .puce{width:3px;height:17px;border-radius:2px;flex:0 0 3px}
.objet .txt{flex:1;word-break:break-word}
.objet .chemin{display:block;font-size:11px;color:var(--gris);margin-top:2px}
.objet .menu{color:#B4BDC2;font-size:16px;padding:0 4px;flex:0 0 auto}

.vide{text-align:center;color:var(--gris);font-size:13.5px;line-height:1.6;padding:38px 20px}
.titre-groupe{font-family:var(--display);text-transform:uppercase;letter-spacing:.13em;
  font-size:10.5px;color:var(--gris);margin:16px 0 7px}
.titre-groupe:first-child{margin-top:2px}

.champ{margin-bottom:14px}
.champ label{display:block;font-family:var(--display);text-transform:uppercase;
  letter-spacing:.13em;font-size:10px;color:var(--gris);margin-bottom:5px}
.champ select,.champ input[type=text]{width:100%;background:var(--carte);border:1px solid #CFD7DB;
  border-radius:8px;padding:12px;font-size:14px;outline:none;appearance:none}
.champ select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23A9B3B8' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
.champ select:focus,.champ input:focus{border-color:var(--accent)}
.bouton{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:14px;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;
  font-weight:500;cursor:pointer;margin-top:4px}
.bouton:active{opacity:.85}
.bouton.secondaire{background:var(--carte);color:var(--accent);border:1px solid #C3D2D8}
.bouton.danger{background:var(--carte);color:var(--danger);border:1px solid #E4C6C7}
.bouton.neutre{background:var(--carte);color:var(--gris);border:1px solid var(--gris-clair)}
.aide{font-size:12px;color:var(--gris);margin-top:10px;line-height:1.5}
.section{margin-top:26px;border-top:1px solid var(--gris-clair);padding-top:18px}
.compte-ligne{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.avatar{width:38px;height:38px;border-radius:50%;background:#E7EEF0;color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 38px}

#onglets{display:flex;background:var(--carte);border-top:1px solid var(--gris-clair);flex:0 0 auto}
#onglets button{flex:1;background:none;border:none;padding:11px 0 13px;font-family:var(--display);
  text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;color:#9AA5AB;cursor:pointer}
#onglets button.actif{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}

#fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:52px;height:52px;
  border-radius:50%;background:var(--accent);color:#fff;border:none;display:none;
  align-items:center;justify-content:center;font-size:30px;font-weight:300;
  box-shadow:0 5px 14px rgba(30,95,116,.4);cursor:pointer;z-index:20;line-height:0}

#voile{position:fixed;inset:0;background:rgba(16,22,26,.45);display:none;z-index:40;align-items:flex-end}
#voile.ouvert{display:flex}
#feuille{width:100%;background:var(--carte);border-radius:14px 14px 0 0;
  padding:20px 18px calc(26px + env(safe-area-inset-bottom));max-height:85%;overflow-y:auto}
#feuille h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
  font-size:16px;margin-bottom:4px;line-height:1.25}
#feuille .ss-titre{font-size:12px;color:var(--gris);margin-bottom:16px}
#feuille .bouton{margin-top:9px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(12px);background:#20272C;color:#fff;padding:11px 18px;
  border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:60;
  max-width:90vw;text-align:center}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* porte d'entrée */
#porte{position:fixed;inset:0;background:var(--fond);z-index:100;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:32px 26px;text-align:center}
#porte .marque{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;
  font-size:11px;color:var(--accent);margin-bottom:8px}
#porte h1{font-family:var(--display);text-transform:uppercase;font-weight:600;
  font-size:32px;letter-spacing:.02em;margin-bottom:14px}
#porte p{font-size:14px;color:var(--gris);line-height:1.6;max-width:34ch;margin-bottom:26px}
#porte .rangee{display:flex;gap:3px;align-items:flex-end;height:44px;margin-bottom:26px}
#porte .rangee div{width:9px;border-radius:1px 1px 0 0}
.gbouton{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:300px;
  padding:13px;border-radius:10px;background:#fff;color:#1f1f1f;font-weight:600;font-size:14.5px;
  border:1px solid #D3DADE;cursor:pointer}
.gbouton:active{background:#EEE}
#porte .note{font-size:11.5px;color:#9AA5AB;margin-top:18px;max-width:32ch;line-height:1.5}
</style>
</head>
<body>

<div id="barre">
  <button id="retour" aria-label="Retour">←</button>
  <h1 id="titre">Inventaire</h1>
  <span id="compte"></span>
  <button id="pastille"><span class="point"></span><span>—</span></button>
</div>

<div class="recherche" id="zone-recherche">
  <input id="champ-recherche" type="text" placeholder="Chercher…" autocomplete="off">
</div>

<div id="corps"></div>
<button id="fab" aria-label="Ajouter">+</button>

<div id="onglets">
  <button data-onglet="etageres" class="actif">Étagères</button>
  <button data-onglet="recherche">Chercher</button>
  <button data-onglet="ajouter">Ajouter</button>
  <button data-onglet="reglages">Réglages</button>
</div>

<div id="voile"><div id="feuille"></div></div>
<div id="toast"></div>

<div id="porte">
  <div class="rangee">
    <div style="background:var(--c-ps);height:100%"></div>
    <div style="background:var(--c-ps);height:78%"></div>
    <div style="background:var(--c-nin);height:92%"></div>
    <div style="background:var(--c-xbox);height:64%"></div>
    <div style="background:var(--c-societe);height:84%"></div>
    <div style="background:var(--c-livre);height:100%"></div>
    <div style="background:var(--c-figurine);height:70%"></div>
  </div>
  <div class="marque">Collection</div>
  <h1>Inventaire</h1>
  <p id="porte-texte">Connecte ton compte Google : ton inventaire se synchronise ensuite tout seul entre ton téléphone et ton PC.</p>
  <button class="gbouton" id="porte-bouton">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    <span>Se connecter avec Google</span>
  </button>
  <p class="note" id="porte-note">La première fois, Google affiche un avertissement « application non vérifiée » : c'est normal pour une app personnelle.</p>
</div>

/* Fusion par identifiant : la version la plus récente gagne, les suppressions
   sont des marqueurs datés, donc rien ne « ressuscite » d'un appareil à l'autre. */
function fusionNoeud(a, b, cleEnfants){
  const recent = (a.maj||0) >= (b.maj||0) ? a : b;
  const base = Object.assign({}, recent);
  if(cleEnfants){
    base[cleEnfants] = fusionListe(a[cleEnfants]||[], b[cleEnfants]||[],
      cleEnfants === 'sous' ? 'objets' : null);
  }
  return base;
}
function fusionListe(la, lb, cleEnfants){
  const m = new Map();
  la.forEach(x => m.set(x.id, x));
  lb.forEach(y => {
    const x = m.get(y.id);
    m.set(y.id, x ? fusionNoeud(x, y, cleEnfants) : y);
  });
  return Array.from(m.values());
}
function fusionner(local, distant){
  if(!distant || !Array.isArray(distant.cats)) return local;
  return {
    version: 1,
    maj: Math.max(local.maj||0, distant.maj||0),
    cats: fusionListe(local.cats, distant.cats, 'sous')
  };
}

/* =========================================================

   ========================================================= */
const Drive = (function(){
  let tokenClient = null, accessToken = null, tokenExpiry = 0;
  let fileId = null, dossierId = null, email = null;
  let etat = 'off';                 // off | connexion | synchro | ok | horsligne | erreur
  let minuteurPush = null, minuteurRefresh = null;
  let enCours = false, enAttente = false;

  /* --- session locale : ouvrir l'app sans repasser par Google --- */
  function session(){ try{ return JSON.parse(localStorage.getItem(CLE_SESSION) || 'null'); }catch(e){ return null; } }
  function poserSession(mail){
    try{ localStorage.setItem(CLE_SESSION, JSON.stringify({owner:mail, vu:maintenant()})); }catch(e){}
  }
  function toucherSession(){
    const s = session();
    if(s){ s.vu = maintenant(); try{ localStorage.setItem(CLE_SESSION, JSON.stringify(s)); }catch(e){} }
  }
  function effacerSession(){ try{ localStorage.removeItem(CLE_SESSION); }catch(e){} }
  function sessionValide(){
    const s = session();
    return !!(s && s.owner && (maintenant() - (s.vu||0) < GRACE));
  }
  const proprietaire = () => { const s = session(); return s ? s.owner : null; };

  /* --- jeton --- */
  function lireJeton(){
    try{
      const d = JSON.parse(localStorage.getItem(CLE_TOKEN) || 'null');
      if(d){
        fileId = d.fileId || null; dossierId = d.dossierId || null; email = d.email || null;
        if(d.token && d.expiry > maintenant()){ accessToken = d.token; tokenExpiry = d.expiry; }
      }
    }catch(e){}
  }
  function garderJeton(){
    try{ localStorage.setItem(CLE_TOKEN, JSON.stringify(
      {token:accessToken, expiry:tokenExpiry, fileId, dossierId, email})); }catch(e){}
  }
  function oublierJeton(){
    accessToken=null; tokenExpiry=0; fileId=null; dossierId=null; email=null;
    try{ localStorage.removeItem(CLE_TOKEN); }catch(e){}
  }

  function setEtat(e){ etat = e; peindrePastille(); }

  function client(){
    if(tokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return null;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE,
      callback: r => {
        if(r && r.access_token){
          accessToken = r.access_token;
          tokenExpiry = maintenant() + (Number(r.expires_in||3300) * 1000);
          garderJeton(); planifierRefresh(); apresConnexion();
        }else{
          setEtat(deverrouille ? 'horsligne' : 'off');
        }
      }
    });
    return tokenClient;
  }
  function connecter(interactif, essais){
    essais = essais || 0;
    if(!client()){
      if(essais > 25) return setEtat('erreur');
      return setTimeout(() => connecter(interactif, essais+1), 400);
    }
    setEtat('connexion');
    try{
      tokenClient.requestAccessToken(
        interactif ? {prompt:'consent'} : {prompt:'', hint: proprietaire() || undefined});
    }catch(e){ setEtat('erreur'); }
  }
  function deconnecter(effacerDonnees){
    if(accessToken){ try{ google.accounts.oauth2.revoke(accessToken, () => {}); }catch(e){} }
    oublierJeton(); effacerSession();
    if(effacerDonnees){ try{ localStorage.removeItem(CLE_DB); }catch(e){} DB = neuf(); }
    deverrouille = false; setEtat('off'); montrerPorte();
  }
  function planifierRefresh(){
    clearTimeout(minuteurRefresh);
    if(!tokenExpiry) return;
    let delai = tokenExpiry - maintenant() - 5*60*1000;   // 5 min avant expiration
    if(delai < 5000) delai = 5000;
    minuteurRefresh = setTimeout(() => connecter(false), delai);
  }

  /* --- appels Drive --- */
  const entetes = extra => Object.assign({Authorization:'Bearer ' + accessToken}, extra || {});
  function api(url, opts){
    opts = opts || {};
    opts.headers = entetes(opts.headers);
    return fetch(url, opts).then(r => {
      if(r.status === 401) throw {code:401};
      if(!r.ok) throw {code:r.status};
      return r.json();
    });
  }
  function chercher(nom, parent, estDossier){
    const q = "name='" + nom.replace(/'/g,"\\'") + "' and trashed=false" +
      (estDossier ? " and mimeType='application/vnd.google-apps.folder'" : "") +
      (parent ? " and '" + parent + "' in parents" : "");
    return api("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&spaces=drive")
      .then(d => (d.files && d.files[0]) ? d.files[0].id : null);
  }
  function creerDossier(nom){
    return api("https://www.googleapis.com/drive/v3/files", {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:nom, mimeType:'application/vnd.google-apps.folder'})
    }).then(d => d.id);
  }
  function creerFichier(parent, contenu){
    const b = 'inv-' + uid();
    const meta = JSON.stringify({name:FICHIER, parents:[parent]});
    const corps =
      '--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n'+
      '--'+b+'\r\nContent-Type: application/json\r\n\r\n'+contenu+'\r\n--'+b+'--';
    return api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body: corps
    }).then(d => d.id);
  }
  function telecharger(id){
    return fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media", {headers:entetes()})
      .then(r => { if(!r.ok) throw {code:r.status}; return r.text(); });
  }
  function televerser(id, contenu){
    return fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media", {
      method:'PATCH', headers:entetes({'Content-Type':'application/json'}), body: contenu
    }).then(r => { if(!r.ok) throw {code:r.status}; return r.json(); });
  }
  function profil(){
    return api("https://www.googleapis.com/drive/v3/about?fields=user")
      .then(d => (d.user && d.user.emailAddress) || null);
  }

  /* --- enchaînement après authentification --- */
  function apresConnexion(){
    setEtat('synchro');
    profil().then(mail => {
      const prop = proprietaire();
      if(prop && mail && prop !== mail){
        oublierJeton();
        setEtat('off');
        alert("Cet inventaire appartient à " + prop + ".\nConnecte-toi avec ce compte, ou déconnecte-toi depuis les réglages pour en changer.");
        return;
      }
      email = mail; if(mail && !prop) poserSession(mail); else toucherSession();
      garderJeton();
      ouvrirApp();
      return synchroniser();
    }).catch(gererErreur);
  }

  function assurerFichier(){
    if(fileId) return Promise.resolve();
    return chercher(DOSSIER, null, true)
      .then(id => id || creerDossier(DOSSIER))
      .then(id => { dossierId = id; return chercher(FICHIER, id, false); })
      .then(id => {
        if(id){ fileId = id; garderJeton(); return; }
        return creerFichier(dossierId, JSON.stringify(DB)).then(nid => { fileId = nid; garderJeton(); });
      });
  }

  /* Synchro complète : je récupère la version du Drive, je fusionne, je renvoie. */
  function synchroniser(silencieuse){
    if(!accessToken){ setEtat(deverrouille ? 'horsligne' : 'off'); return Promise.resolve(); }
    if(enCours){ enAttente = true; return Promise.resolve(); }
    enCours = true; setEtat('synchro');
    return assurerFichier()
      .then(() => telecharger(fileId))
      .then(texte => {
        let distant = null;
        try{ distant = JSON.parse(texte); }catch(e){}
        const avant = JSON.stringify(DB);
        DB = fusionner(DB, distant);
        ecrireLocal();
        if(!silencieuse && JSON.stringify(DB) !== avant) rendre();
        return televerser(fileId, JSON.stringify(DB));
      })
      .then(() => { toucherSession(); setEtat('ok'); })
      .catch(gererErreur)
      .then(() => {
        enCours = false;
        if(enAttente){ enAttente = false; setTimeout(() => synchroniser(true), 400); }
      });
  }

  function planifier(){
    if(!accessToken) return;
    clearTimeout(minuteurPush);
    minuteurPush = setTimeout(() => synchroniser(true), 1500);
  }

  function gererErreur(err){
    if(err && err.code === 401){
      accessToken = null; garderJeton();
      setEtat('horsligne');
      if(sessionValide()) connecter(false);
    }else{
      setEtat(navigator.onLine ? 'erreur' : 'horsligne');
    }
  }

  window.addEventListener('online', () => { if(sessionValide()) connecter(false); });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && sessionValide()){
      if(!accessToken || tokenExpiry - maintenant() < 5*60*1000) connecter(false);
      else synchroniser(true);
    }
  });

  function demarrer(){
    lireJeton();
    if(sessionValide()){
      ouvrirApp();                                  // accès immédiat, même hors ligne
      if(accessToken){ planifierRefresh(); synchroniser(true); }
      else { setEtat('horsligne'); connecter(false); }
    }else{
      setEtat('off'); montrerPorte();
    }
  }

  return {demarrer, connecter, deconnecter, planifier,
    synchroniser: () => synchroniser(false),
    etat: () => etat, email: () => email || proprietaire(),
    connecte: () => !!accessToken, sessionValide};
})();

function peindrePastille(){
  const p = $('#pastille'); if(!p) return;
  const e = Drive.etat();
  let cls = '', txt = 'Local';
  if(e === 'off'){ cls=''; txt='Connecter'; }
  else if(e === 'connexion' || e === 'synchro'){ cls='occupe'; txt='Synchro…'; }
  else if(e === 'ok'){ cls='ok'; txt='À jour'; }
  else if(e === 'horsligne'){ cls='hs'; txt='Hors ligne'; }
  else if(e === 'erreur'){ cls='hs'; txt='Erreur'; }
  p.innerHTML = `<span class="point ${cls}"></span><span>${txt}</span>`;
}

function montrerPorte(){
  $('#porte').style.display = 'flex';
  peindrePastille();
}
function ouvrirApp(){
  if(deverrouille) return;
  deverrouille = true;
  $('#porte').style.display = 'none';
  rendre();
}

/* =========================================================
   3. ÉCRANS
   ========================================================= */
function rendre(){
  if(!deverrouille) return;
  ({accueil:vAccueil, categorie:vCategorie, sousCat:vSousCat,
    recherche:vRecherche, ajouter:vAjouter, reglages:vReglages}[vue.ecran] || vAccueil)();
  peindrePastille();
}
function majBarre(titre, compte, retour){
  $('#titre').textContent = titre;
  $('#compte').textContent = compte || '';
  $('#retour').style.display = retour ? 'block' : 'none';
}
function afficherRecherche(on, ph){
  $('#zone-recherche').style.display = on ? 'block' : 'none';
  if(on && ph) $('#champ-recherche').placeholder = ph;
}
function majOnglets(nom){
  document.querySelectorAll('#onglets button').forEach(b =>
    b.classList.toggle('actif', b.dataset.onglet === nom));
}
const fab = on => { $('#fab').style.display = on ? 'flex' : 'none'; };

function vAccueil(){
  majBarre('Inventaire', totalGlobal() + ' objets', false);
  afficherRecherche(true, "Chercher dans tout l'inventaire");
  majOnglets('etageres'); fab(false);

  corps.innerHTML = cats().map(c => {
    const liste = sousDe(c), n = totalCat(c);
    const max = Math.max(1, ...liste.map(totalSous));
    const etagere = n === 0
      ? `<div class="placeholder">Étagère vide — ajoute un objet</div>`
      : liste.map(s => {
          const q = totalSous(s); if(!q) return '';
          return `<div class="dos" style="background:${col(s.couleur)};width:${(q/n*100).toFixed(2)}%;height:${55 + Math.round(45*Math.sqrt(q/max))}%"></div>`;
        }).join('');
    return `<div class="rayon" data-cat="${c.id}">
      <div class="titre"><h3>${esc(c.nom)}</h3><span>${n}</span></div>
      <div class="sous">${esc(liste.map(s => s.nom).join(' · '))}</div>
      <div class="etagere">${etagere}</div><div class="plateau"></div></div>`;
  }).join('');
  corps.querySelectorAll('.rayon').forEach(el =>
    el.onclick = () => aller({ecran:'categorie', cat:el.dataset.cat}));
}

function vCategorie(){
  const c = cat(vue.cat);
  if(!c) return aller({ecran:'accueil'});
  majBarre(c.nom, String(totalCat(c)), true);
  afficherRecherche(true, 'Chercher dans ' + c.nom.toLowerCase());
  majOnglets('etageres'); fab(true);

  const liste = sousDe(c).sort((a,b) => totalSous(b) - totalSous(a) || parNom(a,b));
  corps.innerHTML = liste.map(s => `
    <div class="ligne" data-sous="${s.id}">
      <span class="marque" style="background:${col(s.couleur)}"></span>
      <span class="nom">${esc(s.nom)}</span><span class="n">${totalSous(s)}</span></div>`).join('') +
    `<button class="bouton secondaire" id="ajout-sous" style="margin-top:12px">+ Nouvelle sous-catégorie</button>`;

  corps.querySelectorAll('.ligne').forEach(el =>
    el.onclick = () => aller({ecran:'sousCat', cat:c.id, sous:el.dataset.sous}));
  $('#ajout-sous').onclick = () => {
    const nom = prompt('Nom de la nouvelle sous-catégorie ?');
    if(!nom || !nom.trim()) return;
    c.sous.push({id:uid(), nom:nom.trim(), couleur:c.couleur, maj:maintenant(), objets:[]});
    enregistrer(); rendre(); toast('Sous-catégorie ajoutée');
  };
}

function vSousCat(){
  const c = cat(vue.cat), s = sous(c, vue.sous);
  if(!s) return aller({ecran:'categorie', cat:vue.cat});
  majBarre(s.nom, String(totalSous(s)), true);
  afficherRecherche(true, 'Chercher un titre');
  majOnglets('etageres'); fab(true);

  const liste = objetsDe(s).sort(parNom);
  corps.innerHTML = liste.length ? liste.map(o => `
    <div class="objet" data-objet="${o.id}">
      <span class="puce" style="background:${col(s.couleur)}"></span>
      <span class="txt">${esc(o.nom)}</span><span class="menu">⋯</span></div>`).join('')
    : `<div class="vide">Rien ici pour l'instant.<br>Touche le bouton + pour ajouter un objet.</div>
       <button class="bouton danger" id="suppr-sous">Supprimer cette sous-catégorie</button>`;

  corps.querySelectorAll('.objet').forEach(el =>
    el.onclick = () => menuObjet(c.id, s.id, el.dataset.objet));
  const b = $('#suppr-sous');
  if(b) b.onclick = () => {
    if(!confirm(`Supprimer la sous-catégorie « ${s.nom} » ?`)) return;
    s.supp = true; s.maj = maintenant();
    enregistrer(); aller({ecran:'categorie', cat:c.id}); toast('Sous-catégorie supprimée');
  };
}

function vRecherche(){
  majBarre('Chercher', '', false);
  afficherRecherche(true, "Chercher dans tout l'inventaire");
  majOnglets('recherche'); fab(false);
  resultats($('#champ-recherche').value);
}

function collecte(){
  const p = [];
  cats().forEach(c => sousDe(c).forEach(s => objetsDe(s).forEach(o => p.push({c,s,o}))));
  return p;
}
function listerResultats(t){
  return `<div class="titre-groupe">${t.length} résultat${t.length>1?'s':''}</div>` + t.map(x => `
    <div class="objet" data-cat="${x.c.id}" data-sous="${x.s.id}" data-objet="${x.o.id}">
      <span class="puce" style="background:${col(x.s.couleur)}"></span>
      <span class="txt">${esc(x.o.nom)}<span class="chemin">${esc(x.c.nom)} · ${esc(x.s.nom)}</span></span>
      <span class="menu">⋯</span></div>`).join('');
}
function brancherResultats(){
  corps.querySelectorAll('.objet').forEach(el =>
    el.onclick = () => menuObjet(el.dataset.cat, el.dataset.sous, el.dataset.objet));
}
function resultats(q){
  q = (q||'').trim().toLowerCase();
  if(q.length < 2){
    corps.innerHTML = `<div class="vide">Tape au moins deux lettres.<br>La recherche couvre les ${totalGlobal()} objets de l'inventaire.</div>`;
    return;
  }
  const t = collecte().filter(x => x.o.nom.toLowerCase().includes(q)).sort((a,b) => parNom(a.o,b.o));
  corps.innerHTML = t.length ? listerResultats(t)
    : `<div class="vide">Aucun objet ne correspond à « ${esc(q)} ».<br>Tu ne l'as sans doute pas encore.</div>`;
  brancherResultats();
}

function vAjouter(){
  majBarre('Ajouter', '', false);
  afficherRecherche(false);
  majOnglets('ajouter'); fab(false);
  const catId = vue.preCat && cat(vue.preCat) ? vue.preCat : cats()[0].id;

  corps.innerHTML = `
    <div class="champ"><label>Catégorie</label>
      <select id="f-cat">${cats().map(c =>
        `<option value="${c.id}" ${c.id===catId?'selected':''}>${esc(c.nom)}</option>`).join('')}</select></div>
    <div class="champ"><label>Sous-catégorie</label><select id="f-sous"></select></div>
    <div class="champ"><label>Nom de l'objet</label>
      <input id="f-nom" type="text" placeholder="ex. Ghost of Yotei" autocomplete="off"></div>
    <button class="bouton" id="f-ok">Enregistrer</button>
    <p class="aide">Tout ce qui n'est pas le titre — un prêt en cours, une édition japonaise — s'écrit directement dans le nom, comme dans le fichier Excel.</p>`;

  const majSous = () => {
    const c = cat($('#f-cat').value);
    $('#f-sous').innerHTML = sousDe(c).map(s =>
      `<option value="${s.id}" ${s.id===vue.preSous?'selected':''}>${esc(s.nom)}</option>`).join('');
  };
  majSous();
  $('#f-cat').onchange = () => { vue.preSous = null; majSous(); };

  const valider = () => {
    const nom = $('#f-nom').value.trim();
    if(!nom) return toast('Il manque le nom');
    const c = cat($('#f-cat').value), s = sous(c, $('#f-sous').value);
    if(!s) return toast('Choisis une sous-catégorie');
    if(objetsDe(s).some(o => o.nom.toLowerCase() === nom.toLowerCase())
       && !confirm(`« ${nom} » est déjà dans ${s.nom}. L'ajouter quand même ?`)) return;
    s.objets.push({id:uid(), nom, maj:maintenant()});
    enregistrer();
    vue.preCat = c.id; vue.preSous = s.id;
    $('#f-nom').value = ''; $('#f-nom').focus();
    toast(`Ajouté dans ${s.nom}`);
  };
  $('#f-ok').onclick = valider;
  $('#f-nom').onkeydown = e => { if(e.key === 'Enter') valider(); };
}

function vReglages(){
  majBarre('Réglages', '', false);
  afficherRecherche(false);
  majOnglets('reglages'); fab(false);

  const mail = Drive.email() || '';
  const e = Drive.etat();
  const detail = e === 'ok' ? `Dossier « ${DOSSIER} » synchronisé automatiquement`
    : (e === 'synchro' || e === 'connexion') ? 'Synchronisation en cours…'
    : 'Hors ligne — les modifications partiront à la prochaine connexion';

  corps.innerHTML = `
    <div class="titre-groupe">Compte</div>
    <div class="compte-ligne">
      <div class="avatar">${esc((mail||'?').slice(0,1).toUpperCase())}</div>
      <div><div style="font-size:14px">${esc(mail || 'Non connecté')}</div>
        <div style="font-size:12px;color:var(--gris);margin-top:2px">${esc(detail)}</div></div>
    </div>
    <button class="bouton secondaire" id="r-sync">Synchroniser maintenant</button>
    <button class="bouton neutre" id="r-out">Se déconnecter</button>

    <div class="section"><div class="titre-groupe">Inventaire</div>
      ${cats().map(c => `<div class="ligne" style="cursor:default">
        <span class="marque" style="background:${col(c.couleur)}"></span>
        <span class="nom">${esc(c.nom)}</span><span class="n">${totalCat(c)}</span></div>`).join('')}
      <div class="ligne" style="cursor:default;background:#EAF0F2">
        <span class="marque" style="background:var(--accent)"></span>
        <span class="nom">Total</span><span class="n">${totalGlobal()}</span></div>
    </div>

    <div class="section"><div class="titre-groupe">Copie de secours</div>
      <button class="bouton secondaire" id="r-export">Exporter en JSON</button>
      <button class="bouton secondaire" id="r-import">Importer un JSON</button>
      <input type="file" id="r-fichier" accept=".json,application/json" style="display:none">
      <p class="aide">La synchro Drive suffit au quotidien. L'export reste utile avant une grosse manipulation.</p>
    </div>

    <div class="section"><div class="titre-groupe">Zone sensible</div>
      <button class="bouton danger" id="r-reset">Repartir du fichier Excel d'origine</button>
      <p class="aide">Efface tout ce qui a été ajouté ou modifié depuis, sur cet appareil et sur le Drive.</p>
    </div>`;

  $('#r-sync').onclick = () => { Drive.synchroniser(); toast('Synchronisation lancée'); };
  $('#r-out').onclick = () => {
    if(!confirm('Se déconnecter ?')) return;
    Drive.deconnecter(confirm("Effacer aussi l'inventaire de cet appareil ?\n(les données restent sur ton Drive)"));
  };
  $('#r-export').onclick = exporter;
  $('#r-import').onclick = () => $('#r-fichier').click();
  $('#r-fichier').onchange = ev => { if(ev.target.files[0]) importer(ev.target.files[0]); };
  $('#r-reset').onclick = () => {
    if(!confirm("Tout remettre à l'état du fichier Excel de départ ?")) return;
    const t = maintenant();
    DB.cats.forEach(c => c.sous.forEach(s => s.objets.forEach(o => { o.supp = true; o.maj = t; })));
    const frais = neuf();
    DB = fusionner(DB, frais);
    DB.cats.forEach(c => c.sous.forEach(s => s.objets.forEach(o => { delete o.supp; o.maj = t + 1; })));
    enregistrer(); aller({ecran:'accueil'}); toast('Inventaire réinitialisé');
  };
}

/* =========================================================
   4. ACTIONS SUR UN OBJET
   ========================================================= */
function ouvrirFeuille(html){ $('#feuille').innerHTML = html; $('#voile').classList.add('ouvert'); }
function fermerFeuille(){ $('#voile').classList.remove('ouvert'); }
$('#voile').addEventListener('click', e => { if(e.target.id === 'voile') fermerFeuille(); });

function menuObjet(catId, sousId, objId){
  const c = cat(catId), s = sous(c, sousId);
  const o = s && s.objets.find(x => x.id === objId && !x.supp);
  if(!o) return;
  ouvrirFeuille(`
    <h4>${esc(o.nom)}</h4><div class="ss-titre">${esc(c.nom)} · ${esc(s.nom)}</div>
    <button class="bouton secondaire" id="m-renommer">Renommer</button>
    <button class="bouton secondaire" id="m-deplacer">Déplacer</button>
    <button class="bouton danger" id="m-suppr">Supprimer</button>
    <button class="bouton neutre" id="m-annuler">Annuler</button>`);

  $('#m-annuler').onclick = fermerFeuille;
  $('#m-renommer').onclick = () => {
    const nom = prompt('Nouveau nom :', o.nom);
    if(nom && nom.trim()){ o.nom = nom.trim(); o.maj = maintenant(); enregistrer(); }
    fermerFeuille(); rendre();
  };
  $('#m-suppr').onclick = () => {
    if(confirm(`Supprimer « ${o.nom} » ?`)){
      o.supp = true; o.maj = maintenant(); enregistrer(); toast('Supprimé');
    }
    fermerFeuille(); rendre();
  };
  $('#m-deplacer').onclick = () => {
    const options = [];
    cats().forEach(cc => sousDe(cc).forEach(ss => options.push({v:cc.id+'|'+ss.id, t:cc.nom+' · '+ss.nom})));
    ouvrirFeuille(`
      <h4>Déplacer</h4><div class="ss-titre">${esc(o.nom)}</div>
      <div class="champ"><label>Nouvel emplacement</label>
        <select id="d-cible">${options.map(op =>
          `<option value="${op.v}" ${op.v === c.id+'|'+s.id ? 'selected':''}>${esc(op.t)}</option>`).join('')}</select></div>
      <button class="bouton" id="d-ok">Déplacer</button>
      <button class="bouton neutre" id="d-annuler">Annuler</button>`);
    $('#d-annuler').onclick = fermerFeuille;
    $('#d-ok').onclick = () => {
      const [ci, si] = $('#d-cible').value.split('|');
      const cible = sous(cat(ci), si);
      if(cible && cible !== s){
        const t = maintenant();
        o.supp = true; o.maj = t;
        cible.objets.push({id:uid(), nom:o.nom, maj:t});
        enregistrer(); toast('Déplacé vers ' + cible.nom);
      }
      fermerFeuille(); rendre();
    };
  };
}

/* =========================================================
   5. EXPORT / IMPORT
   ========================================================= */
function exporter(){
  const d = new Date();
  const nom = `inventaire-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const blob = new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  toast('Fichier exporté');
}
function importer(fichier){
  const l = new FileReader();
  l.onload = ev => {
    try{
      const brut = JSON.parse(ev.target.result);
      const entrant = Array.isArray(brut) ? {version:1, maj:maintenant(), cats:brut} : brut;
      if(!entrant || !Array.isArray(entrant.cats)) throw new Error('format');
      if(!confirm("Fusionner ce fichier avec l'inventaire actuel ?")) return;
      DB = fusionner(DB, entrant);
      enregistrer(); aller({ecran:'accueil'}); toast('Inventaire importé');
    }catch(err){ toast("Ce fichier n'est pas un export d'inventaire"); }
  };
  l.readAsText(fichier);
}

/* =========================================================
   6. NAVIGATION
   ========================================================= */
function aller(v){
  vue = Object.assign({}, v, {preCat:vue.preCat, preSous:vue.preSous});
  $('#champ-recherche').value = '';
  rendre();
  corps.scrollTop = 0;
}
$('#retour').onclick = () =>
  aller(vue.ecran === 'sousCat' ? {ecran:'categorie', cat:vue.cat} : {ecran:'accueil'});
document.querySelectorAll('#onglets button').forEach(b =>
  b.onclick = () => aller({ecran: b.dataset.onglet === 'etageres' ? 'accueil' : b.dataset.onglet}));
$('#fab').onclick = () => {
  vue.preCat = vue.cat; vue.preSous = vue.sous;
  aller({ecran:'ajouter'});
};
$('#pastille').onclick = () => {
  if(!Drive.connecte() && !Drive.sessionValide()) return Drive.connecter(true);
  aller({ecran:'reglages'});
};
$('#porte-bouton').onclick = () => {
  $('#porte-texte').textContent = "Ouverture de la fenêtre Google…";
  Drive.connecter(true);
};

$('#champ-recherche').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  if(vue.ecran === 'recherche') return resultats(q);
  if(q.length < 2) return rendre();
  let pool;
  if(vue.ecran === 'accueil') pool = collecte();
  else if(vue.ecran === 'categorie'){
    const c = cat(vue.cat); pool = [];
    sousDe(c).forEach(s => objetsDe(s).forEach(o => pool.push({c,s,o})));
  } else if(vue.ecran === 'sousCat'){
    const c = cat(vue.cat), s = sous(c, vue.sous);
    pool = objetsDe(s).map(o => ({c,s,o}));
  } else return;
  const t = pool.filter(x => x.o.nom.toLowerCase().includes(q)).sort((a,b) => parNom(a.o,b.o));
  corps.innerHTML = t.length ? listerResultats(t)
    : `<div class="vide">Aucun résultat pour « ${esc(q)} ».</div>`;
  brancherResultats();
});

/* =========================================================
   7. DÉMARRAGE
   ========================================================= */
charger();
Drive.demarrer();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
